services:
  - type: web
    name: envoiso-site
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      # Each page has its own prerendered file (title, description, heading). Render answers
      # /pricing with the catch-all below unless the page has its own rule, so crawlers that do
      # not run JavaScript would see the home page's title everywhere. scripts/prerender-meta.mjs
      # fails the build if a page is missing here.
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /compliance
        destination: /compliance/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /careers
        destination: /careers/index.html
      - type: rewrite
        source: /partners
        destination: /partners/index.html
      - type: rewrite
        source: /partners/directory
        destination: /partners/directory/index.html
      - type: rewrite
        source: /academy
        destination: /academy/index.html
      - type: rewrite
        source: /academy/fundamentals
        destination: /academy/fundamentals/index.html
      - type: rewrite
        source: /academy/partner
        destination: /academy/partner/index.html
      - type: rewrite
        source: /academy/operations
        destination: /academy/operations/index.html
